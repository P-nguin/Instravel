<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 260px; padding: 15px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f9fafb; color: #111827; margin: 0; }
    h3 { margin-top: 0; font-size: 16px; margin-bottom: 8px; }
    p { font-size: 13px; color: #4b5563; margin-bottom: 16px; line-height: 1.4; }
    button { width: 100%; padding: 10px; background: #2563eb; color: #fff; cursor: pointer; border: none; border-radius: 6px; font-weight: 500; transition: background 0.2s; }
    button:hover { background: #1d4ed8; }
    #status { margin-top: 12px; font-size: 12px; font-weight: 500; color: #059669; text-align: center; margin-bottom: 0;}
    .error { color: #dc2626 !important; }
  </style>
</head>
<body>
  <h3>Scout Exporter</h3>
  <p>Open an Instagram Saved folder, then click below to sync reels to your local database.</p>
  <button id="exportBtn">Sync Reels to Scout</button>
  <p id="status"></p>
  <script src="popup.js"></script>
</body>
</html>
